apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
images:
  - name: cctv-worker
    newName: ghcr.io/aman-tiwari18/cctv-worker
    newTag: uat            # CI replaces with uat-<sha>:  kustomize edit set image cctv-worker=...:uat-$SHA
patches:
  - target: { kind: ConfigMap, name: cctv-worker-config }
    patch: |-
      - op: replace
        path: /data/MAIN_BACKEND_URL
        value: http://192.168.19.30:4000/prod_cctv/api
  - target: { kind: StatefulSet, name: cctv-worker }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
