apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
namePrefix: dev-
images:
  - name: cctv-worker
    newName: ghcr.io/aman-tiwari18/cctv-worker
    newTag: uat
patches:
  - target: { kind: StatefulSet, name: cctv-worker }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: ConfigMap, name: cctv-worker-config }
    patch: |-
      - op: replace
        path: /data/MAIN_BACKEND_URL
        value: http://192.168.19.45:4000/dev_cctv/api
