# UAT worker deploy (headless agent). One service per GPU; this file shows GPU 0.
# On the big hosts, copy the gpu0 block per GPU, bumping WORKER_INDEX + device_ids.
# Same image everywhere — differences are ENV only.
#
# Run from the repo root:  docker-compose -f deploy/docker-compose.uat.yml up -d
# (run with: docker-compose --project-directory <repo-root> -f deploy/docker-compose.uat.yml up -d)
services:
  worker-gpu0:
    image: ${IMAGE:-cctv-worker}:${IMAGE_TAG:-uat}
    container_name: cctv_uat_worker_gpu0
    restart: unless-stopped
    shm_size: '16gb'
    env_file: .env
    environment:
      WORKER_MODE: agent            # headless: poller only, no HTTP API / socket
    # backend runs on the HOST under PM2 → reach it via the docker host gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ${HF_CACHE_HOST_PATH:-./hf_cache}:/app/data/hf_cache
      - ./scripts/logs:/app/scripts/logs
      # shared frames root — MUST equal the backend's FRAMES_DIR so images resolve
      - ${FRAMES_HOST_PATH:-./results}:/app/scripts/detection/results
    networks: [cctvv2_net]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

networks:
  # the new-stack network created by backend/infra/docker-compose.yml (MySQL/Redis)
  cctvv2_net:
    external: true
