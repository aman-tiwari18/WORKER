# UAT worker deploy (headless agent). One service per GPU; this file shows GPU 0.
# On the big hosts, copy the gpu0 block per GPU, bumping WORKER_INDEX + device_ids.
# Same image everywhere — differences are ENV only.
#
# Deploy with Compose v2 (v1 cannot recreate: KeyError 'ContainerConfig'):
#   docker compose --project-directory /data/new_dev/worker -f deploy/docker-compose.uat.yml up -d
# --project-directory is required: compose resolves env_file/./paths from the project dir.
services:
  worker-gpu0:
    image: ${IMAGE:-cctv-worker}:${IMAGE_TAG:-uat}
    container_name: cctv_uat_worker_gpu0
    restart: unless-stopped
    shm_size: '16gb'
    env_file: .env
    environment:
      IS_MAIN_WORKER: "1"           # single-worker stack: write RUNNING/COMPLETED so the Executions tab is correct
      WORKER_MODE: agent            # headless: poller only, no HTTP API / socket
      # Report the PHYSICAL host to the fleet registry. Without this the agent
      # falls back to socket.gethostname(), which inside a container is the
      # container ID — it changes on every recreate and hides which box a GPU
      # is actually on. Defaults to the deploying shell's hostname.
      WORKER_HOSTNAME: ${WORKER_HOSTNAME:-${HOSTNAME:-unknown-host}}
      # Logs were timestamped in UTC while the run header printed IST, so every
      # line read 5h30m behind the wall clock. The base CUDA image ships no
      # tzdata, so TZ alone is not enough — the zoneinfo mounts below supply it.
      TZ: ${TZ:-Asia/Kolkata}
      # Pin the HF cache to the bind mount below. start_vllm.sh used to hardcode
      # /data/hf_cache, which is NOT a mount — the 62GB model landed on the
      # container overlay and was lost on every recreate, forcing a full
      # re-download on each cold start.
      HF_HOME: /app/data/hf_cache
      # db_client._canonicalize_frame_path() rewrites every frame_path to this
      # root before the DB write, so the UI can resolve one canonical path
      # regardless of which host captured the frame. Its default is the shared
      # NFS root (/data/nfs/cctv_images/classification_frames), which this stack
      # does NOT use — frames live under FRAMES_HOST_PATH — so rows were stored
      # pointing at a directory that does not exist and every frame 404'd.
      # Derive it from the same dir that is bind-mounted below so the worker and
      # the backend's NFS_FRAMES_ROOT always agree.
      NFS_FRAMES_ROOT: ${NFS_FRAMES_ROOT:-${FRAMES_HOST_PATH:-/data/new_dev/frames}/classification_frames}
    # backend runs on the HOST under PM2 → reach it via the docker host gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ${HF_CACHE_HOST_PATH:-./hf_cache}:/app/data/hf_cache
      # Same host dir mounted a second time at the legacy container path.
      # Images built before the start_vllm.sh fix hardcode
      # `export HF_HOME=/data/hf_cache`, which overrides the HF_HOME set
      # above — this mount makes that stale path resolve to the same
      # persistent cache instead of the throwaway overlay. Safe to drop
      # once every deployed image carries the fixed script.
      - ${HF_CACHE_HOST_PATH:-./hf_cache}:/data/hf_cache
      - ./scripts/logs:/app/scripts/logs
      # tzdata is absent from the nvidia/cuda base image; borrow the host's so
      # TZ=Asia/Kolkata actually resolves and log timestamps read as IST.
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
      # shared frames root — MUST equal the backend's FRAMES_DIR so images resolve
      - ${FRAMES_HOST_PATH:-./results}:/app/scripts/detection/results
    networks: [cctvv2_net]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  # Camera uptime checker (camera_uptime/ in this image): during live shifts it captures one frame per scheduled
  # camera and records UP / DOWN per shift. CPU only, no GPU. Every Fleet server runs one; they split the DVRs
  # among themselves (auto sharding). Switched on/off with the Fleet setting UPTIME_ENABLED (default off).
  camera-uptime:
    image: ${IMAGE:-cctv-worker}:${IMAGE_TAG:-uat}
    container_name: cctv_uat_camera_uptime
    restart: unless-stopped
    env_file: .env                  # DB_* (direct, cctvv2_mysql), CAMVIEW_TOKEN_SERVER, Fleet settings block
    working_dir: /app/camera_uptime
    entrypoint: ["python", "run.py", "run"]
    command: []
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      UPTIME_ENABLED: ${UPTIME_ENABLED:-0}
      UPTIME_WORKER_ID: worker-uat
      UPTIME_SHARD_COUNT: "0"       # auto: share the DVRs with the other servers' checkers
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8096"             # 8095 is the old setup's checker on this host
      FRAMES_ROOT: /app/scripts/detection/results/uptime_frames
      SPOOL_DIR: /app/scripts/logs/uptime-spool
      LOCK_FILE: /tmp/camera-uptime.lock
      PAUSE_FILE: /app/scripts/logs/UPTIME_PAUSE
    ports:
      - "127.0.0.1:8096:8096"       # the backend's Camera Uptime page reads /status here
    volumes:
      - ./scripts/logs:/app/scripts/logs
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
      - ${FRAMES_HOST_PATH:-./results}:/app/scripts/detection/results
    healthcheck:                    # the image's own check is nvidia-smi; this container has no GPU
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [cctvv2_net]

networks:
  # the new-stack network created by backend/infra/docker-compose.yml (MySQL/Redis)
  cctvv2_net:
    external: true
