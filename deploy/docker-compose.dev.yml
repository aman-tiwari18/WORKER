# DEV worker (H200-dev / GPUInfer02, NVIDIA L4, detection-only).
# Pulls the ghcr image built by the uat pipeline (the L4's disk can't hold a
# second 17GB build). Backend mode -> no DB network; the worker reaches the dev
# backend via the MAIN VM's Apache reverse proxy (MAIN_BACKEND_URL in .env),
# because on this host a container cannot reach its own host directly.
# Run with: docker compose --project-directory /data/dev/worker -f deploy/docker-compose.dev.yml up -d
services:
  worker-gpu0:
    image: ${IMAGE:-ghcr.io/aman-tiwari18/cctv-worker}:${IMAGE_TAG:-uat}
    container_name: cctv_dev_worker_gpu0
    restart: unless-stopped
    shm_size: '8gb'
    env_file: .env
    # Image entrypoint (docker-entrypoint.sh): skips the MySQL gate when
    # DB_ACCESS_MODE=backend and seeds ./models from the image (fine-tuned
    # monitor_person_yolo26m.pt / best_mobile_model.pt) — do not override it.
    environment:
      IS_MAIN_WORKER: "1"           # single-worker stack: write RUNNING/COMPLETED so the Executions tab is correct
      # Base CUDA image has no tzdata and defaults to UTC, so log lines read
      # 5h30m behind the IST wall clock; zoneinfo is bind-mounted below.
      TZ: ${TZ:-Asia/Kolkata}
      # Pin the HF cache to the bind mount. start_vllm.sh used to hardcode
      # /data/hf_cache, which is not a mount, so the 62GB model went to the
      # container overlay and re-downloaded on every recreate.
      HF_HOME: /app/data/hf_cache
      # db_client._canonicalize_frame_path() rewrites every frame_path to this
      # root before the DB write, so the UI can resolve one canonical path
      # regardless of which host captured the frame. Its default is the shared
      # NFS root (/data/nfs/cctv_images/classification_frames), which this stack
      # does NOT use — frames live under FRAMES_HOST_PATH — so rows were stored
      # pointing at a directory that does not exist and every frame 404'd.
      # Derive it from the same dir that is bind-mounted below so the worker and
      # the backend's NFS_FRAMES_ROOT always agree.
      NFS_FRAMES_ROOT: ${NFS_FRAMES_ROOT:-${FRAMES_HOST_PATH:-/data/dev/frames}/classification_frames}
    volumes:
      - ./models:/app/models
      - ./hf_cache:/app/data/hf_cache
      # Same host dir mounted a second time at the legacy container path.
      # Images built before the start_vllm.sh fix hardcode
      # `export HF_HOME=/data/hf_cache`, which overrides the HF_HOME set
      # above — this mount makes that stale path resolve to the same
      # persistent cache instead of the throwaway overlay. Safe to drop
      # once every deployed image carries the fixed script.
      - ./hf_cache:/data/hf_cache
      - ./scripts/logs:/app/scripts/logs
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
      - /data/dev/frames:/app/scripts/detection/results
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
