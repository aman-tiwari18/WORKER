name: Deploy · worker

# Two environments from two branches:
#   uat     -> prod2 (main VM, H200): BUILD the image on the GPU runner, push to
#              ghcr, deploy with deploy/docker-compose.uat.yml in /data/new_dev/worker.
#   develop -> dev   (H200-dev, L4) : PULL the ghcr image (the L4's disk can't hold
#              a second 17GB build), deploy with deploy/docker-compose.dev.yml in
#              /data/dev/worker. Worker code is identical across envs; the env
#              differences (ENABLE_VLLM=0, backend URL) live in the dev .env.
on:
  push:
    branches: [uat, develop]
  workflow_dispatch: {}

concurrency:
  group: worker-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile-check agent + detection code
        run: |
          python -m py_compile run.py app/poller.py app/script_runner.py \
            app/fleet_agent.py app/lifecycle.py app/leases.py \
            app/camera_distributor.py app/config.py \
            scripts/detection/pipeline/master_pipeline.py \
            scripts/detection/unified_detector.py \
            scripts/detection/utils/camera_loader.py \
            scripts/detection/utils/db_gateway.py \
            patch_vllm.py patch_vllm_deep_gemm.py
          echo "compile OK"

  deploy:
    needs: ci
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    runs-on:
      - self-hosted
      - ${{ github.ref_name == 'develop' && 'cctv-dev' || 'cctv-uat' }}
      - gpu
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve environment (by branch)
        run: |
          if [ "${{ github.ref_name }}" = "develop" ]; then
            echo "IS_UAT=false"                                     >> "$GITHUB_ENV"
            echo "DEPLOY_DIR=/data/dev/worker"                      >> "$GITHUB_ENV"
            echo "COMPOSE_FILE=deploy/docker-compose.dev.yml"       >> "$GITHUB_ENV"
            echo "IMAGE=ghcr.io/aman-tiwari18/cctv-worker"          >> "$GITHUB_ENV"
            echo "IMAGE_TAG=uat"                                    >> "$GITHUB_ENV"
          else
            echo "IS_UAT=true"                                      >> "$GITHUB_ENV"
            echo "DEPLOY_DIR=/data/new_dev/worker"                  >> "$GITHUB_ENV"
            echo "COMPOSE_FILE=deploy/docker-compose.uat.yml"       >> "$GITHUB_ENV"
            echo "IMAGE=$(echo "${{ vars.WORKER_IMAGE || 'cctv-worker' }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
            echo "IMAGE_TAG=uat-${{ github.sha }}"                  >> "$GITHUB_ENV"
          fi

      # ── uat: build + push the image on the prod2 GPU runner ──────────────────
      - name: Registry login (uat push)
        if: ${{ env.IS_UAT == 'true' && vars.WORKER_REGISTRY_PUSH == 'true' }}
        run: echo "${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}" | docker login "${IMAGE%%/*}" -u "${{ github.actor }}" --password-stdin
      - name: Build image (uat)
        if: ${{ env.IS_UAT == 'true' }}
        run: docker build -t "$IMAGE:$IMAGE_TAG" -t "$IMAGE:uat" .
      - name: Push to ghcr (uat)
        if: ${{ env.IS_UAT == 'true' && vars.WORKER_REGISTRY_PUSH == 'true' }}
        run: |
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:uat"

      # ── develop: pull the prebuilt ghcr image on the dev GPU runner ──────────
      - name: Pull image (develop)
        if: ${{ env.IS_UAT == 'false' }}
        run: docker pull "$IMAGE:$IMAGE_TAG"

      # ── both: sync code + (re)deploy the container ───────────────────────────
      - name: Sync code to deploy dir (keep .env, models, caches, results)
        run: |
          rsync -a --delete \
            --exclude '.git/' --exclude '.env' \
            --exclude 'models/' --exclude 'hf_cache/' --exclude 'logs/' --exclude 'results/' \
            ./ "$DEPLOY_DIR/"
      - name: Deploy container (Compose v2)
        run: |
          cd "$DEPLOY_DIR"
          IMAGE="$IMAGE" IMAGE_TAG="$IMAGE_TAG" \
            docker compose --project-directory "$DEPLOY_DIR" -f "$COMPOSE_FILE" up -d
          docker compose --project-directory "$DEPLOY_DIR" -f "$COMPOSE_FILE" ps
