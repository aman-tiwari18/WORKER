name: UAT · worker

# GPU image → must build on a self-hosted runner on a fleet GPU host
# (label: cctv-uat + gpu). That host also needs Docker's data-root on /data
# (root is space-constrained). Same image runs on w0-3 and w5/6 (vLLM patched).
on:
  push:
    branches: [uat]
  workflow_dispatch: {}

concurrency:
  group: worker-uat
  cancel-in-progress: true

env:
  # Override with repo variable WORKER_IMAGE (e.g. ghcr.io/<owner>/cctv-worker,
  # or a local registry host:5000/cctv-worker).
  # Local tag by default: build+deploy run on the SAME host, so no registry round-trip
  # for a ~17GB image. Set repo var WORKER_IMAGE=<registry>/cctv-worker (and
  # WORKER_REGISTRY_PUSH=true) only when deploying to OTHER hosts.
  IMAGE: ${{ vars.WORKER_IMAGE || 'cctv-worker' }}

jobs:
  # Lightweight CI on a GitHub-hosted runner — always runs (keeps the pipeline
  # green without needing the GPU self-hosted runner).
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile-check agent + detection code
        run: |
          python -m py_compile run.py app/poller.py app/script_runner.py \
            app/fleet_agent.py app/lifecycle.py app/leases.py \
            app/camera_distributor.py app/config.py \
            scripts/detection/pipeline/master_pipeline.py \
            scripts/detection/unified_detector.py \
            scripts/detection/utils/camera_loader.py \
            scripts/detection/utils/db_gateway.py \
            patch_vllm.py patch_vllm_deep_gemm.py
          echo "compile OK"

  build:
    needs: ci
    # GPU image build — gated behind a self-hosted GPU runner + repo variable
    # ENABLE_DEPLOY=true. Until then only the ci job runs (green, not stuck).
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    runs-on: [self-hosted, cctv-uat, gpu]
    # packages:write lets the built-in GITHUB_TOKEN push to ghcr.io with no extra
    # secret — the image publishes to ghcr.io/<owner>/cctv-worker on every build,
    # which is what lets any new GPU host pull-and-run it (continuous scaling).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Normalise image name (ghcr requires a lowercase path)
        run: echo "IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Registry login (only when pushing to a registry)
        if: ${{ vars.WORKER_REGISTRY_PUSH == 'true' }}
        run: echo "${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}" | docker login "${IMAGE%%/*}" -u "${{ github.actor }}" --password-stdin
      - name: "Build image (~15-25GB CUDA+torch+vllm; needs docker data-root on /data)"
        run: |
          docker build -t "$IMAGE:uat-${{ github.sha }}" -t "$IMAGE:uat" .
      - name: Push to registry (opt-in; required for multi-host scaling)
        if: ${{ vars.WORKER_REGISTRY_PUSH == 'true' }}
        run: |
          docker push "$IMAGE:uat-${{ github.sha }}"
          docker push "$IMAGE:uat"
          echo "published $IMAGE:uat (and :uat-${{ github.sha }}) — new hosts: deploy/scale-worker.sh"

  deploy:
    needs: build
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    runs-on: [self-hosted, cctv-uat, gpu]
    environment: uat
    steps:
      - uses: actions/checkout@v4
      - name: Deploy worker container(s) with the new image
        run: |
          DEPLOY_DIR="${{ vars.WORKER_DEPLOY_DIR || '/data/new_dev/worker' }}"
          rsync -a --delete --exclude '.git/' --exclude '.env' \
            --exclude 'models/' --exclude 'hf_cache/' --exclude 'logs/' --exclude 'results/' \
            ./ "$DEPLOY_DIR/"
          cd "$DEPLOY_DIR"
          export IMAGE_TAG="uat-${{ github.sha }}"
          # Use Compose v2. compose v1 (1.29.2) crashes on RECREATE against modern
          # Docker Engine: KeyError 'ContainerConfig' — it can create a container but
          # not redeploy over an existing one, which is exactly what CI does.
          IMAGE="$IMAGE" IMAGE_TAG="$IMAGE_TAG" \
            docker compose --project-directory "$DEPLOY_DIR" -f deploy/docker-compose.uat.yml up -d
          docker compose --project-directory "$DEPLOY_DIR" -f deploy/docker-compose.uat.yml ps
